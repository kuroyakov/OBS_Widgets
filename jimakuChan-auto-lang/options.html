<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>jimakuChan Auto Language Bridge 設定</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111827;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
      min-width: 340px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    input[type="number"] {
      width: 140px;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #1e293b;
      color: #f8fafc;
      font-size: 14px;
    }
    .hint {
      font-size: 12px;
      color: #94a3b8;
      margin: 8px 0 14px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #btn-save {
      background: #6366f1;
      color: #ffffff;
    }
    #btn-reset {
      background: #334155;
      color: #e2e8f0;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
    }
    .status-ok { color: #34d399; }
    .status-err { color: #f87171; }
  </style>
</head>
<body>
  <h1>OBS Widgets 接続設定</h1>
  <label for="server-port">統合サーバー ポート番号</label>
  <input type="number" id="server-port" min="1" max="65535" step="1" value="8080">
  <p class="hint">
    <code>server.py</code> の待ち受けポート（環境変数 <code>OBS_WIDGETS_PORT</code>）に合わせて設定してください。既定値は <code>8080</code> です。
  </p>
  <div class="actions">
    <button id="btn-save" type="button">保存</button>
    <button id="btn-reset" type="button">デフォルト (8080) に戻す</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
  <script src="options.js"></script>
</body>
</html>
