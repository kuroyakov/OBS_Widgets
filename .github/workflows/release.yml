name: release

# 配布パッケージのビルドと Release (Issue #146 / #147)。
# 通常はタグ <package>-vX.Y.Z の push で起動する。
# workflow_dispatch は動作確認用 (dry_run=true なら Release を作らず
# ZIP を artifact として残すだけ)。
on:
  push:
    tags:
      - "*-v*.*.*"
  workflow_dispatch:
    inputs:
      package:
        description: "package name"
        required: true
        type: choice
        options:
          - clock
          - endroll
          - stampalert-twitch
          - twitch-audio-panner
          - webcanvas
          - keyboard
          - ticker
          - pngtuber
          - commentviewer
          - voicecommand
      version:
        description: "version (X.Y.Z)"
        required: true
        type: string
      dry_run:
        description: "build only (no release)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # ${{ }} は run: に直接展開せず env: 経由で渡す (スクリプトインジェクション対策)。
      # 値は GITHUB_OUTPUT に書く前に形式を検証する。
      - name: Resolve package / version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            pkg="$INPUT_PACKAGE"
            ver="$INPUT_VERSION"
            dry="$INPUT_DRY_RUN"
          else
            pkg="${GITHUB_REF_NAME%-v*}"
            ver="${GITHUB_REF_NAME##*-v}"
            dry="false"
          fi
          if ! printf '%s' "$pkg" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo "invalid package name: $pkg" >&2; exit 1
          fi
          if ! printf '%s' "$ver" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "invalid version (need X.Y.Z): $ver" >&2; exit 1
          fi
          if [ "$dry" != "true" ] && [ "$dry" != "false" ]; then
            echo "invalid dry_run: $dry" >&2; exit 1
          fi
          echo "pkg=${pkg}" >> "$GITHUB_OUTPUT"
          echo "ver=${ver}" >> "$GITHUB_OUTPUT"
          echo "dry=${dry}" >> "$GITHUB_OUTPUT"
          echo "tag=${pkg}-v${ver}" >> "$GITHUB_OUTPUT"

      # ビルドには個人情報スキャンのゲート (例外なし) が含まれる。
      # ヒットしたパッケージはここで失敗し、Release は作られない。
      - name: Build package
        env:
          PKG: ${{ steps.meta.outputs.pkg }}
          VER: ${{ steps.meta.outputs.ver }}
        run: python3 tools/build_package.py "$PKG" "$VER" --out dist

      # リリースパッケージ単独スモーク E2E (Issue #43)。
      # ZIP 展開→セットアップ再現→サーバー起動→ページ疎通に失敗した場合、
      # 後続の Release 作成は実行されない。
      - name: Install Playwright for smoke E2E
        run: |
          python3 -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/pip install -q playwright==1.65.2
          /tmp/e2e-venv/bin/playwright install chromium
          sudo /tmp/e2e-venv/bin/playwright install-deps chromium

      - name: Run package smoke E2E
        env:
          PKG: ${{ steps.meta.outputs.pkg }}
          VER: ${{ steps.meta.outputs.ver }}
        run: |
          /tmp/e2e-venv/bin/python -u tools/e2e_smoke.py \
            --package "$PKG" \
            --zip "dist/${PKG}-v${VER}.zip" \
            --artifacts-dir e2e-artifacts

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ steps.meta.outputs.tag }}
          path: e2e-artifacts/
          if-no-files-found: ignore

      - name: Upload artifact (dry run)
        if: steps.meta.outputs.dry == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.tag }}
          path: dist/

      - name: Create release
        if: steps.meta.outputs.dry != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ steps.meta.outputs.tag }}
          PKG: ${{ steps.meta.outputs.pkg }}
          VER: ${{ steps.meta.outputs.ver }}
          TARGET_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          prev_tag="$(git tag --list "${PKG}-v*" --sort=-v:refname | grep -Fxv "$REL_TAG" | head -n 1 || true)"
          python3 tools/build_package.py "$PKG" "$VER" --release-notes --repo "$REPO_NAME" --prev-tag "$prev_tag" --target "$TARGET_SHA" > dist/RELEASE_NOTES.md
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$REL_TAG" *.zip SHA256SUMS.txt \
            --target "$TARGET_SHA" \
            --title "$PKG v$VER" \
            --notes-file RELEASE_NOTES.md
